services:
  orion_front:
    build: ./orion
    expose:
      - "3000"

  orion_mail:
    image: roundcube/roundcubemail:1.5.9-apache
    restart: always
    environment:
      - ROUNDCUBE_DB_TYPE=pgsql
      - ROUNDCUBE_DB_HOST=roundcube-db
      - ROUNDCUBE_DB_PORT=5432
      - ROUNDCUBE_DB_USER=roundcube
      - ROUNDCUBE_DB_PASSWORD=roundcubepass
      - ROUNDCUBE_DB_NAME=roundcube
      - ROUNDCUBE_DEFAULT_HOST=mail
      - ROUNDCUBE_DEFAULT_PORT=143
      - ROUNDCUBE_SMTP_SERVER=mail
      - ROUNDCUBE_SMTP_PORT=587
      - ROUNDCUBE_SMTP_USER=admin@mail.orion.vka
      - ROUNDCUBE_SMTP_PASS=adminpass
    depends_on:
      - roundcube-db
      - mail
    expose:
      - "80"
    volumes:
      - ./flag.txt:/flag.txt:ro

  roundcube-db:
    image: postgres:15-alpine
    container_name: roundcube-db
    restart: always
    environment:
      - POSTGRES_USER=roundcube
      - POSTGRES_PASSWORD=roundcubepass
      - POSTGRES_DB=roundcube
    volumes:
      - roundcube-data:/var/lib/postgresql/data
    expose:
      - "5432"

  orion_nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - orion_front
      - orion_mail

  mail:
    image: mailserver/docker-mailserver:latest
    container_name: mail
    hostname: mail.orion.vka
    env_file: ./mailserver.env
    restart: always
    volumes:
      - mail-data:/var/mail
      - mail-state:/var/mail-state
      - mail-logs:/var/log/mail
      - config:/tmp/docker-mailserver/
    command: >
      sh -c "
        sleep 20 &&
        echo 'Настраиваю почтовый ящик...' &&
        setup email add admin@mail.orion.vka adminpass &&
        echo 'Настройка завершена, запускаю сервер' &&
        exec /usr/bin/supervisord -c /etc/supervisor/supervisord.conf
      "
    expose:
      - "25"
      - "143"
      - "587"

volumes:
  mail-data:
  mail-state:
  mail-logs:
  config:
  roundcube-data:
